# Edunexus Platform — Docker Compose (production, single EC2 host)
# Usage: docker compose --env-file .env.compose up -d
#
# Deployment order enforced by depends_on + healthcheck:
#   keycloak (no deps) → campuscore (DB only) → strapi (DB only) → edunexusai (all three)

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${RDS_HOST}:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  campuscore:
    build:
      context: ../campuscoresis
      dockerfile: Dockerfile
    container_name: campuscore
    env_file: ./env/campuscore.env
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  strapi:
    build:
      context: ../feddrick-cms
      dockerfile: Dockerfile
    container_name: strapi
    env_file: ./env/strapi.env
    volumes:
      - strapi-uploads:/app/public/uploads
    ports:
      - "127.0.0.1:1337:1337"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1337/_health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  edunexusai:
    build:
      context: ../edunexus/backend
      dockerfile: Dockerfile
    container_name: edunexusai
    env_file: ./env/edunexusai.env
    volumes:
      - edunexusai-branding:/app/storage/branding
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      keycloak:
        condition: service_healthy
      campuscore:
        condition: service_healthy
      strapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1-alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      edunexusai:
        condition: service_healthy
    restart: unless-stopped

volumes:
  strapi-uploads:
  edunexusai-branding:
